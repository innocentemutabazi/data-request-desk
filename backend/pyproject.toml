[project]
name = "dataset-request-desk-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: asyncpg connections are loop-bound, so a shared engine
# must not outlive the loop that created it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Keep the CI lint gate focused on correctness and undefined names; FastAPI's
# dependency declarations intentionally use calls in function defaults.
select = ["E4", "E7", "E9", "F"]
