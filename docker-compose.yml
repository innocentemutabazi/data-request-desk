# One command boots everything:   docker compose up --build
#
#   db ──▶ migrate (alembic upgrade head) ──▶ seed (users.json + episodes.csv) ──▶ backend ──▶ frontend
#
# Each arrow is a real dependency: `service_healthy` / `service_completed_successfully`, so nothing starts
# against a half-initialised database. Re-running is safe: migrations and the seed are idempotent.
#
#   UI:  http://localhost:8080        API docs: http://localhost:8000/docs

x-backend: &backend
  image: dataset-request-desk-backend:local   # one tag shared by migrate/seed/backend: built once
  build: ./backend
  environment: &backend-env
    DATABASE_HOST: db
    DATABASE_USER: desk
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    DATABASE_NAME: desk
    JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789abcdef}
    CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ENVIRONMENT: ${ENVIRONMENT:-local}
    SEED_DIR: /seed

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: desk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d desk"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *backend
    command: ["python", "-m", "scripts.seed"]
    volumes:
      - ./seed:/seed:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      # Export simulation: 2-5 s, 20% failure per attempt, up to 3 attempts (override to demo failures).
      EXPORT_FAILURE_RATE: ${EXPORT_FAILURE_RATE:-0.2}
      EXPORT_MAX_ATTEMPTS: ${EXPORT_MAX_ATTEMPTS:-3}
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
