server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CSV imports can be large and slow (cleaning + millions of inserts): don't let the proxy cut them off.
  client_max_body_size 1g;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # SPA -> same-origin API: the browser only ever talks to this host, so there is no CORS surface.
  location /api/ {
    proxy_pass http://backend:8000/;       # trailing slash strips the /api prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;           # stream uploads straight through
  }

  # Hashed build assets are immutable.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve the app shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
